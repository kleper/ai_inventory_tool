version: '3.8'

services:
  backend:
    build: ./backend
    container_name: smartinventory_backend
    volumes:
      - ./backend:/app
      - app_media:/app/media
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: smartinventory_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    # Volumes removed to ensure we use the standalone build from the image
    # volumes:
    #   - ./frontend:/app
    #   - /app/node_modules
    #   - /app/.next
    env_file:
      - .env
    depends_on:
      - backend
    environment:
      - INTERNAL_BACKEND_URL=http://backend:8000
    stdin_open: true
    tty: true

  db:
    image: postgres:15-alpine
    container_name: smartinventory_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  app_media:
